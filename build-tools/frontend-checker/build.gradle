// Build-time only. Platform distributions merge core/runtime/ui explicitly.
dependencies {
    implementation project(':core')
    compileOnly gradleApi()
    testImplementation gradleApi()
    testImplementation project(':ui')
}
tasks.named('jar') {
    manifest { attributes('Main-Class': 'com.atom.lib.frontend.checker.CheckerMain', 'FCL-Scope': 'CANDIDATE_SOURCE_AND_CONTRACT', 'FCL-Protocol': '1,2') }
}
