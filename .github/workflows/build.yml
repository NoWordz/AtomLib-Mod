name: AtomLib build

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Only the pure-Java contract module and the Python verifiers are
  # platform-neutral. ui hardcodes Windows Yoga + Skija natives (the shipped
  # platform set), so its tests live in the Windows job below.
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Pure-Java contract tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test :frontend-checker:test --no-daemon --console=plain
      - name: Verifier self-tests
        run: |
          python3 tools/test_verify_artifacts.py
          python3 tools/test_verify_consumers.py
          python3 tools/verify_ui_examples.py

  source-native:
    # ui testRuntimeOnly pins natives-windows and skija-windows-x64; runtime
    # selects the native by host OS. A Linux runner therefore cannot load the
    # Yoga/Skija natives at all, so the full source suite runs on the Windows
    # host the library is actually validated on.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: CPU and source tests
        shell: pwsh
        run: |
          $testFont='C:\Windows\Fonts\msyh.ttc'
          if (-not (Test-Path $testFont)) { $testFont='C:\Windows\Fonts\arial.ttf' }
          .\gradlew.bat :runtime:test :ui:test "-PatomlibTestFont=$testFont" --no-daemon --console=plain
      - name: Strict native scene, independent legacy path and missing-hover mutant
        shell: pwsh
        run: |
          $testFont='C:\Windows\Fonts\msyh.ttc'
          if (-not (Test-Path $testFont)) { $testFont='C:\Windows\Fonts\arial.ttf' }
          $classpathOutput=Join-Path $pwd 'build/frontend-contract-lock/native-scene-classpath.txt'
          .\gradlew.bat frontendProbeClasspath -I tools/frontend-contract-lock/probe-classpath.init.gradle "-PfrontendProbeClasspathOutput=$classpathOutput" --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/frontend-contract-lock/verify_strict_scenario.py --java-home "$env:JAVA_HOME" --font "$testFont"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-native-scenes
          path: build/frontend-contract-lock/native-scene-*/
          if-no-files-found: error

  frontend-consumers:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - id: buildjava
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Isolated Maven source, resource and executed scene acceptance
        shell: pwsh
        run: |
          $consumerHome=$env:JAVA_HOME
          $env:JAVA_HOME='${{ steps.buildjava.outputs.path }}'
          .\gradlew.bat :core:publishMavenJavaPublicationToTestRepository :frontend-checker:publishMavenJavaPublicationToTestRepository --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/frontend-contract-lock/verify_consumer.py --java-home "$consumerHome" --language-level ${{ matrix.java }} --protocol 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-consumer-java${{ matrix.java }}
          path: build/frontend-contract-lock/consumer-*/
          if-no-files-found: error

  hidden-gl:
    # Windows runners have no OpenGL driver beyond GDI Generic 1.1, so a 3.3
    # core context cannot be created there. Linux runners run the same tests
    # under Xvfb with Mesa llvmpipe, matching AtomChat's Linux CI practice.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [1.20.1-forge, 1.21.1-fabric, 1.21.1-neoforge]
    steps:
      - uses: actions/checkout@v7
      - name: Install Xvfb and GL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 xvfb
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.target == '1.20.1-forge' && '17' || '21' }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Real hidden GLFW/OpenGL round trips
        working-directory: platforms/${{ matrix.target }}
        run: |
          chmod +x gradlew
          xvfb-run -a ./gradlew hiddenGlTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hidden-gl-${{ matrix.target }}
          path: platforms/${{ matrix.target }}/build/test-results/hiddenGlTest
          if-no-files-found: error

  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: java17
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - id: java21
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, publish locally and verify six isolated consumers
        shell: pwsh
        run: |
          $env:JAVA17_HOME='${{ steps.java17.outputs.java-home }}'
          $env:JAVA21_HOME='${{ steps.java21.outputs.java-home }}'
          $testFont='C:\Windows\Fonts\msyh.ttc'
          if (-not (Test-Path $testFont)) { $testFont='C:\Windows\Fonts\arial.ttf' }
          $env:ATOMLIB_TEST_FONT=$testFont
          # pwsh does not fail the step on a native command's non-zero exit,
          # so each command must propagate its exit code explicitly.
          python tools/run_packaging.py all --jobs 1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_verify_artifacts.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_verify_consumers.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_ui_examples.py
      - name: Archive pinned Maven input
        shell: pwsh
        env:
          JAVA_HOME: ${{ steps.java17.outputs.java-home }}
        run: |
          .\gradlew.bat :publishToTestRepository --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_maven_input.py
      - uses: actions/upload-artifact@v7
        with:
          name: atomlib-local-maven
          path: |
            build/atomlib-input-*.zip
            build/atomlib-input-*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: atomlib-platform-jars
          path: platforms/*/build/libs/*.jar
          if-no-files-found: error
