def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def archName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def os = osName.startsWith('windows') ? 'windows' :
        (osName.startsWith('mac') || osName.startsWith('darwin')) ? 'macos' :
        osName.startsWith('linux') ? 'linux' : null
def arch = archName in ['amd64', 'x86_64', 'x64'] ? 'x64' :
        archName in ['aarch64', 'arm64'] ? 'arm64' : null
ext.atomlibTestNatives = os && arch ? [
    skija: "skija-${os}-${arch}",
    lwjgl: "natives-${os}${arch == 'arm64' ? '-arm64' : ''}"
] : null
